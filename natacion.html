<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cupos Itbawitas</title>
<meta name="description" content="Liberá o tomá cupos de los entrenamientos de natación ITBA.">
<meta name="theme-color" content="#0f4d8a">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna pensada para celular; tira horizontal de fechas, día elegido con cupos grandes, lista de espera y lista del día */
:root{
  --bg:#f2f6fa; --surface:#ffffff; --fg:#0c2238; --muted:#5a6f84; --line:#d8e2ec;
  --pool:#0f4d8a; --pool-soft:#e3edf7; --laurel:#6f6f6f; --lane-a:#e3503e; --lane-b:#f2c230;
  --free:#0e8a5c; --free-soft:#dcf3e8; --taken:#6a4fb3; --taken-soft:#ebe5f8; --warn-soft:#fff3d3;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07131f; --surface:#0e2031; --fg:#e3edf5; --muted:#8da3b7; --line:#1e3850;
  --pool:#5aa9ea; --pool-soft:#11304b; --laurel:#a7a7a7; --lane-a:#ef6f5f; --lane-b:#f2c94c;
  --free:#3fd095; --free-soft:#0f3829; --taken:#aa90f2; --taken-soft:#272047; --warn-soft:#3a3115;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07131f; --surface:#0e2031; --fg:#e3edf5; --muted:#8da3b7; --line:#1e3850;
  --pool:#5aa9ea; --pool-soft:#11304b; --laurel:#a7a7a7; --lane-a:#ef6f5f; --lane-b:#f2c94c;
  --free:#3fd095; --free-soft:#0f3829; --taken:#aa90f2; --taken-soft:#272047; --warn-soft:#3a3115;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.status{margin-top:12px;background:var(--warn-soft);border-radius:10px;padding:9px 12px;font-size:13px}
button.act[disabled]{opacity:.55;cursor:wait}
.loading{padding:28px 0;color:var(--muted);text-align:center}
header{display:flex;gap:14px;align-items:center;padding-block:18px 6px}
.logo{width:72px;height:79px;flex:none;border-radius:14px;background:#fff;padding:4px;box-shadow:0 1px 0 var(--line)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--pool);font-size:13px}
h1{font-family:var(--display);font-weight:800;font-size:38px;line-height:.95;margin:2px 0 0;letter-spacing:.01em}
.sub{color:var(--muted);margin:10px 0 0;font-size:15px}
.lanes{height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--lane-a) 0 12px,transparent 12px 18px,var(--lane-b) 18px 30px,transparent 30px 36px);margin-top:14px;opacity:.9}

/* tira de fechas */
.strip-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);margin-inline:-16px;padding-block:10px 8px;border-bottom:1px solid var(--line)}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.date{scroll-snap-align:start;flex:none;width:76px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:8px 4px 7px;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px}
.date .dw{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.date .dn{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.date .hr{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.date .fc{margin-top:4px;min-height:22px;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:14px;color:var(--free);background:var(--free-soft);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.date .fc.zero{background:transparent;color:var(--muted);font-weight:500;font-size:12px}
.date[aria-selected="true"]{background:var(--pool);border-color:var(--pool);color:#fff}
.date[aria-selected="true"] .hr{color:#fff}
.date[aria-selected="true"] .fc{background:#fff;color:var(--free)}
.date[aria-selected="true"] .fc.zero{background:transparent;color:#fff}
.month{flex:none;align-self:center;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* búsqueda personal */
.mine{margin-top:14px;display:flex;gap:8px}
.mine input{flex:1;min-width:0}
.mine-res{margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.mine-res div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}

/* cabecera del día */
.dayhead{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end;margin:18px 0 12px}
.dayhead h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;margin:0}
.dayhead .meta{grid-column:1;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.big{grid-row:1/3;grid-column:2;text-align:center;border-radius:14px;padding:6px 14px;background:var(--free-soft);color:var(--free)}
.big b{display:block;font-family:var(--display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.big.zero{background:var(--pool-soft);color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sect{font-family:var(--display);font-weight:700;font-size:20px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sect small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.row{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{display:flex;align-items:center;gap:10px;min-width:0}
.lane{font-family:var(--display);font-weight:600;color:var(--muted);width:20px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.who{flex:1;min-width:0}
.who .name{font-weight:600;overflow-wrap:anywhere}
.who .state{font-size:13px;color:var(--muted)}
.who .state.ok{color:var(--taken);font-weight:600}
.row.is-free .name,.row.is-gone .name{text-decoration:line-through;color:var(--muted)}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;flex:none}
.chip.free{background:var(--free-soft);color:var(--free)}
.chip.taken{background:var(--taken-soft);color:var(--taken)}
button.act{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:9px 12px;min-height:40px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);flex:none}
button.act.primary{background:var(--free);border-color:var(--free);color:#fff}
button.act.pool{background:var(--pool);border-color:var(--pool);color:#fff}
button.act.link{border:0;padding:6px 4px;min-height:0;color:var(--muted);text-decoration:underline;font-weight:500}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--pool);outline-offset:2px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline p{margin:0;font-size:14px;color:var(--muted);flex-basis:100%}
input[type=text],input[type=password],textarea,select{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--fg);min-width:0}
.inline input{flex:1 1 150px}
.q{counter-reset:q}
.q .row-main .lane{color:var(--pool)}
.empty{padding:14px;color:var(--muted);font-size:14px}
.qjoin{padding:12px 14px;border-top:1px solid var(--line);background:var(--pool-soft)}
.how{font-size:13px;color:var(--muted);margin:8px 2px 0}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.log li{display:flex;gap:10px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;flex:none;width:86px}

.admin{margin-top:30px;border:1px dashed var(--line);border-radius:14px;padding:14px}
.admin summary{cursor:pointer;font-weight:600;padding:4px 0}
.admin-body{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.pin{display:flex;gap:10px;justify-content:center}
.pin input{width:52px;height:60px;text-align:center;font-family:var(--display);font-size:30px;font-weight:700;padding:0}
.admin textarea{width:100%;min-height:220px;font-size:15px}
.muted{color:var(--muted);font-size:14px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;width:max-content;max-width:calc(100% - 32px);z-index:9;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="status" id="status" hidden></div>
  <header>
    <div class="logo"><img src="/logo.jpg" alt="Escudo de natación ITBA" width="64" height="70"></div>
    <div>
      <div class="eyebrow">ITBA · Natación</div>
      <h1>Cupos Itbawitas</h1>
    </div>
  </header>
  <p class="sub">¿No podés ir? Liberá tu lugar. ¿Querés nadar? Anotate en la lista de espera y el primer cupo que se libere es tuyo.</p>
  <div class="lanes" aria-hidden="true"></div>

  <div class="mine">
    <input type="text" id="mineName" placeholder="Tu nombre: ¿me asignaron un cupo?" autocomplete="name">
    <button class="act pool" id="mineBtn">Buscar</button>
  </div>
  <div class="mine-res" id="mineRes"></div>

  <div class="strip-wrap"><nav class="strip" id="strip" role="tablist" aria-label="Próximos entrenamientos"></nav></div>

  <section id="day"><div class="loading">Cargando cupos…</div></section>

  <div class="sect">Actividad reciente</div>
  <ul class="log" id="log"></ul>

  <details class="admin" id="admin">
    <summary>Administración de listas</summary>
    <div class="admin-body" id="adminBody"></div>
  </details>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const SCHEDULE={1:"20:00–21:30",3:"20:00–21:30",5:"20:00–21:30",6:"13:00–14:00"};
const END={1:[21,30],3:[21,30],5:[21,30],6:[14,0]};
const DOWN=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const WEEKS=6;

// fecha y hora actual en Buenos Aires, sin importar la zona del celular
function nowAR(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Argentina/Buenos_Aires",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;return{y:+g("year"),m:+g("month"),d:+g("day"),h:+g("hour")%24,mi:+g("minute")}}
function buildDates(){const n=nowAR(),out=[];
  for(let i=0;i<WEEKS*7;i++){const d=new Date(Date.UTC(n.y,n.m-1,n.d+i,12));const w=d.getUTCDay();if(!SCHEDULE[w])continue;
    if(i===0&&(n.h*60+n.mi)>=END[w][0]*60+END[w][1])continue;
    out.push({key:d.toISOString().slice(0,10),day:d.getUTCDate(),month:d.getUTCMonth(),dow:w})}
  return out}

let DATES=buildDates(),STATE=null,cur=DATES[0].key,open=null,busy=false,adminPin=null;
const $=s=>document.querySelector(s);
function el(tag,a,...kids){const e=document.createElement(tag);for(const k in a||{}){if(k==="class")e.className=a[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}kids.forEach(c=>{if(c!=null)e.append(c.nodeType?c:document.createTextNode(c))});return e}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3400)}
const clean=s=>String(s||"").trim().replace(/\s+/g," ");
const D=()=>DATES.find(d=>d.key===cur);
const day=k=>(STATE&&STATE.dates[k])||{slots:{},queue:[]};
const roster=d=>(STATE&&STATE.rosters[d.dow])||[];
const freeCount=d=>roster(d).filter(r=>day(d.key).slots[r]&&day(d.key).slots[r].status==="free").length;
const label=d=>DOWN[d.dow]+" "+d.day+"/"+(d.month+1);

// nombre recordado en este celular para no escribirlo cada vez
const savedName=()=>{try{return localStorage.getItem("itbawitas-nombre")||""}catch(e){return""}};
const saveName=n=>{try{localStorage.setItem("itbawitas-nombre",n)}catch(e){}};

async function refresh(){
  try{const r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw 0;STATE=await r.json();$("#status").hidden=true;
    DATES=buildDates();if(!DATES.some(d=>d.key===cur))cur=DATES[0].key;render()}
  catch(e){const s=$("#status");s.textContent="No se pudo conectar. Revisá tu internet; reintentamos solos.";s.hidden=false}}

async function act(body){if(busy)return;busy=true;document.querySelectorAll("button.act").forEach(b=>b.disabled=true);
  try{const r=await fetch("/api/action",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({error:"Error de conexión"}));
    if(j.state)STATE=j.state;
    if(!r.ok){toast(j.error||"No se pudo guardar");await refresh()}else{open=null;toast(j.message||"Listo")}}
  catch(e){toast("Sin conexión. Probá de nuevo")}
  busy=false;render()}

const release=name=>act({action:"release",date:cur,name});
const reclaim=name=>act({action:"reclaim",date:cur,name});
const giveBack=name=>act({action:"giveBack",date:cur,name});
function take(name,who){who=clean(who);if(!who){toast("Escribí tu nombre");return}saveName(who);act({action:"take",date:cur,name,who})}
function join(who){who=clean(who);if(!who){toast("Escribí tu nombre");return}saveName(who);act({action:"join",date:cur,who})}
const leave=who=>act({action:"leave",date:cur,who});

function renderStrip(){const nav=$("#strip");const keep=nav.scrollLeft;nav.replaceChildren();let lastM=-1;
  DATES.forEach(d=>{if(d.month!==lastM){if(lastM!==-1)nav.append(el("span",{class:"month","aria-hidden":"true"},MES[d.month].slice(0,3)));lastM=d.month}
    const n=STATE?freeCount(d):0;
    nav.append(el("button",{class:"date",role:"tab",id:"t-"+d.key,"aria-selected":String(d.key===cur),onclick:()=>{cur=d.key;open=null;render();window.scrollTo({top:$("#day").offsetTop-$(".strip-wrap").offsetHeight-8,behavior:"smooth"})}},
      el("span",{class:"dw"},DOWN[d.dow].slice(0,3)),el("span",{class:"dn"},String(d.day)),
      el("span",{class:"hr"},SCHEDULE[d.dow].replace(":00","").replace(":00","")),
      el("span",{class:"fc"+(n?"":" zero")},!STATE?"…":n+(n===1?" libre":" libres"))))});
  nav.scrollLeft=keep;
  const t=document.getElementById("t-"+cur);if(t){const l=t.offsetLeft-nav.offsetLeft,r=l+t.offsetWidth;if(l<nav.scrollLeft||r>nav.scrollLeft+nav.clientWidth)nav.scrollLeft=l-16}}

function nameInput(id,onEnter){const i=el("input",{type:"text",id,placeholder:"Tu nombre y apellido",autocomplete:"name",maxlength:"40",onkeydown:e=>{if(e.key==="Enter")onEnter(i.value)}});i.value=savedName();return i}

function renderDay(){if(!STATE)return;const d=D(),s=day(d.key),box=$("#day");
  const keepQ=$("#qName")?$("#qName").value:null;box.replaceChildren();
  const n=freeCount(d),list=roster(d);
  box.append(el("div",{class:"dayhead"},
    el("h2",{},DOWN[d.dow]+" "+d.day+" de "+MES[d.month]),
    el("div",{class:"big"+(n?"":" zero")},el("b",{},String(n)),el("span",{},n===1?"cupo libre":"cupos libres")),
    el("div",{class:"meta"},SCHEDULE[d.dow]+" h · 2 carriles · "+list.length+" anotados")));

  box.append(el("div",{class:"sect"},"Lista de espera",el("small",{},s.queue.length?s.queue.length+" esperando":"")));
  const q=el("div",{class:"card q"});
  if(!s.queue.length)q.append(el("div",{class:"empty"},n?"Nadie esperando. Si querés un lugar, anotate y lo tomás al instante.":"Nadie esperando. Anotate y el próximo lugar que se libere es tuyo."));
  s.queue.forEach((name,i)=>q.append(el("div",{class:"row"},el("div",{class:"row-main"},el("span",{class:"lane"},(i+1)+"º"),
    el("div",{class:"who"},el("div",{class:"name"},name),el("div",{class:"state"},i===0?"Primero para el próximo lugar":"Esperando")),
    el("button",{class:"act link",onclick:()=>leave(name)},"Salir")))));
  const qi=nameInput("qName",join);if(keepQ!==null)qi.value=keepQ;
  q.append(el("div",{class:"qjoin"},el("div",{class:"inline"},qi,el("button",{class:"act pool",onclick:()=>join(qi.value)},"Quiero cupo"))));
  box.append(q,el("p",{class:"how"},"Cuando alguien libera, el lugar pasa solo al 1º de la lista. No llega aviso: entrá y buscá tu nombre arriba."));

  box.append(el("div",{class:"sect"},"Nadadores del día",el("small",{},"Tocá Liberar si no vas")));
  const card=el("div",{class:"card"});
  list.forEach((name,i)=>{const x=s.slots[name];let state="Va a entrenar",chip=null,btns=[];
    const row=el("div",{class:"row"+(x?x.status==="free"?" is-free":" is-gone":"")});
    if(!x)btns=[el("button",{class:"act",onclick:()=>{open={name};render()}},"Liberar")];
    else if(x.status==="free"){state="Liberó su lugar";chip=el("span",{class:"chip free"},"Libre");
      btns=[el("button",{class:"act primary",onclick:()=>{open={name,take:1};render();setTimeout(()=>{const t=$("#takeName");t&&t.focus()},0)}},"Tomar")]}
    else{state="Va "+x.by+(x.via==="lista"?" (lista de espera)":"");chip=el("span",{class:"chip taken"},"Reemplazo");
      btns=[el("button",{class:"act link",onclick:()=>{open={name,back:1};render()}},"Devolver")]}
    row.append(el("div",{class:"row-main"},el("span",{class:"lane"},String(i+1)),
      el("div",{class:"who"},el("div",{class:"name"},name),el("div",{class:"state"+(x&&x.status==="taken"?" ok":"")},state)),chip,...btns));
    if(open&&open.name===name){
      const cancel=el("button",{class:"act",onclick:()=>{open=null;render()}},"Cancelar");
      if(open.take){const t=nameInput("takeName",v=>take(name,v));
        row.append(el("div",{class:"inline"},t,el("button",{class:"act primary",onclick:()=>take(name,t.value)},"Confirmar"),cancel))}
      else if(open.back)row.append(el("div",{class:"inline"},el("p",{},(x&&x.by)+" deja este cupo del "+label(d)+". "+(s.queue.length?"Pasa a "+s.queue[0]+".":"Queda libre.")),
        el("button",{class:"act pool",onclick:()=>giveBack(name)},"Sí, devolver"),cancel));
      else row.append(el("div",{class:"inline"},el("p",{},"Tu lugar del "+label(d)+" "+(s.queue.length?"pasa a "+s.queue[0]+", 1º en la lista de espera.":"queda libre para otra persona.")),
        el("button",{class:"act pool",onclick:()=>release(name)},"Sí, liberar"),cancel));
    }else if(x&&x.status==="free")row.append(el("div",{class:"inline"},el("button",{class:"act link",onclick:()=>reclaim(name)},"¿Sos "+name.split(" ")[0]+"? Recuperar tu lugar")));
    card.append(row)});
  box.append(card)}

function renderLog(){const ul=$("#log");ul.replaceChildren();if(!STATE)return;
  if(!STATE.log.length){ul.append(el("li",{},el("span",{class:"muted"},"Todavía no hay movimientos.")));return}
  STATE.log.slice(0,8).forEach(l=>{const p=new Intl.DateTimeFormat("es-AR",{timeZone:"America/Argentina/Buenos_Aires",day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(l.t));
    ul.append(el("li",{},el("time",{},p.replace(",","")),el("span",{},l.txt)))})}

function searchMine(){const n=clean($("#mineName").value).toLowerCase(),r=$("#mineRes");r.replaceChildren();if(!n||!STATE)return;saveName(clean($("#mineName").value));
  const hits=[];DATES.forEach(d=>{const s=day(d.key);
    roster(d).forEach(k=>{const v=s.slots[k];if(v&&v.status==="taken"&&v.by.toLowerCase().includes(n))hits.push("✓ Tenés cupo el "+label(d)+" ("+SCHEDULE[d.dow]+" h), en el lugar de "+k)});
    const qi=s.queue.findIndex(q=>q.toLowerCase().includes(n));if(qi>=0)hits.push("… "+label(d)+": estás "+(qi+1)+"º en la lista de espera")});
  if(!hits.length)hits.push("No aparecés como reemplazo ni en ninguna lista de espera.");
  hits.forEach(h=>r.append(el("div",{},h)))}
$("#mineBtn").addEventListener("click",searchMine);
$("#mineName").addEventListener("keydown",e=>{if(e.key==="Enter")searchMine()});
$("#mineName").value=savedName();

function renderAdmin(){const b=$("#adminBody");b.replaceChildren();
  if(!adminPin){const boxes=[0,1,2,3].map(i=>el("input",{type:"password",inputmode:"numeric",pattern:"[0-9]*",maxlength:"1",id:"pin"+i,"aria-label":"Dígito "+(i+1)}));
    boxes.forEach((x,i)=>{x.addEventListener("input",async()=>{x.value=x.value.replace(/\D/g,"").slice(0,1);if(x.value&&i<3)boxes[i+1].focus();
      const v=boxes.map(y=>y.value).join("");if(v.length!==4)return;
      boxes.forEach(y=>y.disabled=true);
      try{const r=await fetch("/api/pin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({pin:v})});const j=await r.json();
        if(r.ok){adminPin=v;renderAdmin();toast("Entraste como organizador");return}toast(j.error||"PIN incorrecto")}catch(e){toast("Sin conexión")}
      boxes.forEach(y=>{y.disabled=false;y.value=""});boxes[0].focus()});
      x.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!x.value&&i>0)boxes[i-1].focus()})});
    b.append(el("p",{class:"muted"},"Ingresá el PIN de 4 números para cambiar las listas de nadadores."),el("div",{class:"pin"},...boxes));return}
  const sel=el("select",{id:"adminDay"});[1,3,5,6].forEach(w=>sel.append(el("option",{value:w},DOWN[w]+" ("+SCHEDULE[w]+")")));sel.value=String(D().dow);
  const ta=el("textarea",{id:"adminList"});const load=()=>ta.value=(STATE.rosters[sel.value]||[]).join("\n");sel.addEventListener("change",load);load();
  b.append(el("p",{class:"muted"},"Pegá la lista del mes, un nombre por línea (se copia directo de la planilla). Se aplica a todas las fechas de ese día. Lo liberado y las listas de espera se mantienen."),
    sel,ta,el("div",{class:"inline"},
      el("button",{class:"act pool",onclick:async()=>{const names=ta.value.split("\n").map(clean).filter(Boolean);if(!names.length){toast("La lista está vacía");return}
        await act({action:"setRoster",pin:adminPin,dow:Number(sel.value),names});renderAdmin()}},"Guardar lista"),
      el("button",{class:"act link",onclick:()=>{adminPin=null;renderAdmin()}},"Salir")))}
$("#admin").addEventListener("toggle",()=>{if($("#admin").open&&STATE)renderAdmin()});

function render(){renderStrip();renderDay();renderLog()}
render();renderAdmin();refresh();
// se actualiza solo cada 20 segundos y al volver a la pestaña (sin pisar lo que estás escribiendo)
setInterval(()=>{if(document.visibilityState==="visible"&&!open&&!busy&&!(document.activeElement&&document.activeElement.tagName==="INPUT"))refresh()},20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!busy)refresh()});
</script>
